name: Validate public resources

on:
  pull_request:
    paths:
      - "data/manifests/**"
      - "tools/validate_resource_manifest.py"
      - "requirements-dev.txt"
      - ".github/workflows/validate-resources.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate public resource manifest
        run: python tools/validate_resource_manifest.py
